{% extends 'core/base.html' %}
{% block title %}Categorias{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Categorias</h3>
    <a href="{% url 'categoria_novo' %}" class="btn btn-primary">+ Nova Categoria</a>
</div>
<table class="table table-hover">
    <thead><tr><th>Nome</th><th class="text-end">Ações</th></tr></thead>
    <tbody>
    {% for categoria in categorias %}
        <tr>
            <td>{{ categoria.nome }}</td>
            <td class="text-end">
                <a href="{% url 'categoria_editar' categoria.pk %}" class="btn btn-sm btn-outline-primary">Editar</a>
                <a href="{% url 'categoria_excluir' categoria.pk %}" class="btn btn-sm btn-outline-danger">Excluir</a>
            </td>
        </tr>
    {% empty %}
        <tr><td colspan="2" class="text-center text-muted py-4">Nenhuma categoria cadastrada.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
