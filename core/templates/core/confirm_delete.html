{% extends 'core/base.html' %}
{% block title %}Confirmar exclusão{% endblock %}
{% block content %}
<div>
    <h3>Confirmar exclusão</h3>
    <p>Tem certeza que deseja excluir <strong>{{ object }}</strong>? Essa ação não pode ser desfeita.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sim, excluir</button>
        <a href="javascript:history.back()" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
