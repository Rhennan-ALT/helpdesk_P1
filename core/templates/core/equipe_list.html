{% extends 'core/base.html' %}
{% block title %}Equipes{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Equipes</h3>
    <a href="{% url 'equipe_novo' %}" class="btn btn-primary">+ Nova Equipe</a>
</div>
<table class="table table-hover">
    <thead><tr><th>Nome</th><th class="text-end">Ações</th></tr></thead>
    <tbody>
    {% for equipe in equipes %}
        <tr>
            <td>{{ equipe.nome }}</td>
            <td class="text-end">
                <a href="{% url 'equipe_editar' equipe.pk %}" class="btn btn-sm btn-outline-primary">Editar</a>
                <a href="{% url 'equipe_excluir' equipe.pk %}" class="btn btn-sm btn-outline-danger">Excluir</a>
            </td>
        </tr>
    {% empty %}
        <tr><td colspan="2" class="text-center text-muted py-4">Nenhuma equipe cadastrada.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
